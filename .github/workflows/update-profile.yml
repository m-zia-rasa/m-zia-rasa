name: Update profile artwork

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "profile.json"
      - "scripts/**"
      - ".github/workflows/update-profile.yml"
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Fetch public contribution data
        env:
          GH_PROFILE_USER: m-zia-rasa
        run: python scripts/fetch_contributions.py
      - name: Render contribution SVG
        run: python scripts/render_contributions.py
      - name: Commit refreshed artwork
        run: |
          if git diff --quiet -- data/contributions.json assets/contrib-heatmap.svg; then
            echo "No contribution changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json assets/contrib-heatmap.svg
          git commit -m "chore: refresh contribution graph"
          git push
