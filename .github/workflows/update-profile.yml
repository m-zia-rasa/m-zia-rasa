name: Sync GitHub profile

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: [main]
    paths:
      - "profile.json"
      - "scripts/**"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

concurrency:
  group: github-profile-sync
  cancel-in-progress: true

jobs:
  sync:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Sync public GitHub metadata and avatar
        continue-on-error: true
        run: python scripts/sync_github_profile.py

      - name: Render profile cards
        run: |
          python scripts/render_profile.py
          python scripts/render_ascii.py

      - name: Refresh contribution data
        id: contributions
        continue-on-error: true
        env:
          GH_PROFILE_USER: m-zia-rasa
        run: python scripts/fetch_contributions.py

      - name: Render contribution graph
        if: steps.contributions.outcome == 'success'
        run: python scripts/render_contributions.py

      - name: Commit refreshed profile
        run: |
          git add profile.json assets/ data/ || true
          if git diff --cached --quiet; then
            echo "Profile is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync GitHub profile"
          git pull --rebase origin main
          git push origin HEAD:main
